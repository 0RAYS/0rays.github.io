<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海风巡航：骑自行车的鹈鹕 3D 交互场景</title>
  <style>
    :root {
      --glass: rgba(15, 25, 42, 0.68);
      --glass-border: rgba(255, 255, 255, 0.16);
      --accent: #ff9f43;
      --accent-2: #00d2d3;
      --text: #f5f8fc;
      --subtext: #a5b8d0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0b162c;
      color: var(--text);
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* HUD 界面 */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 26px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-card {
      pointer-events: auto;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 14px 20px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }

    .title-card h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), #ff6b6b);
      color: #fff;
      font-weight: 700;
    }

    .title-card p {
      font-size: 12px;
      color: var(--subtext);
      margin-top: 4px;
    }

    .telemetry {
      pointer-events: auto;
      display: flex;
      gap: 14px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 12px 18px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }

    .stat-item {
      text-align: center;
      min-width: 68px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--subtext);
      display: block;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-2);
      font-variant-numeric: tabular-nums;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }

    .control-panel {
      pointer-events: auto;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 16px 20px;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 320px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      pointer-events: auto;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .btn.active {
      background: var(--accent);
      color: #101824;
      border-color: transparent;
      box-shadow: 0 0 16px rgba(255, 159, 67, 0.5);
    }

    .btn.action {
      background: linear-gradient(135deg, rgba(0, 210, 211, 0.22), rgba(84, 160, 255, 0.22));
      border-color: rgba(0, 210, 211, 0.45);
    }

    .btn.action:hover {
      background: linear-gradient(135deg, rgba(0, 210, 211, 0.4), rgba(84, 160, 255, 0.4));
    }

    .toast {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(15, 25, 42, 0.85);
      border: 1px solid rgba(255, 159, 67, 0.5);
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .keys-hint {
      font-size: 11px;
      color: var(--subtext);
      text-align: right;
      line-height: 1.6;
    }

    .key-pill {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-family: monospace;
      margin: 0 2px;
    }

    @media (max-width: 768px) {
      .keys-hint { display: none; }
      .control-panel { width: 100%; min-width: unset; }
    }
  </style>

  <!-- Three.js ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport"></div>
  <div id="toast" class="toast">叮铃铃！鹈鹕开心地张开了大喉囊~</div>

  <div class="hud">
    <div class="top-bar">
      <div class="title-card">
        <h1>
          <span>海风巡航 · 鹈鹕单车</span>
          <span class="badge">Procedural 3D</span>
        </h1>
        <p>左键旋转视角 · 右键平移 · 滚轮缩放 · 点击 3D 鹈鹕或车铃可触发互动</p>
      </div>

      <div class="telemetry">
        <div class="stat-item">
          <span class="stat-label">骑行速度</span>
          <span class="stat-value" id="speedStat">18.0 km/h</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">踏频 CAD</span>
          <span class="stat-value" id="cadenceStat">72 RPM</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">喉囊存鱼</span>
          <span class="stat-value" id="fishStat">1 条</span>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="control-panel">
        <div class="slider-row">
          <span>骑行速度</span>
          <input type="range" id="speedSlider" min="0" max="2.6" step="0.05" value="1.15" />
          <span id="speedMulLabel" style="min-width: 44px; text-align: right;">1.15x</span>
        </div>

        <div class="btn-group">
          <button class="btn action" id="btnFeed">投喂鲜鱼 (F)</button>
          <button class="btn action" id="btnBell">按响车铃 (B)</button>
          <button class="btn action" id="btnJump">展翅跳跃 (Space)</button>
          <button class="btn action" id="btnLight">车头灯开关 (L)</button>
        </div>

        <div class="btn-group" id="timeGroup">
          <button class="btn active" data-time="day">晴朗海风</button>
          <button class="btn" data-time="sunset">落日余晖</button>
          <button class="btn" data-time="night">星夜巡航</button>
        </div>

        <div class="btn-group" id="camGroup">
          <button class="btn active" data-cam="free">自由环绕</button>
          <button class="btn" data-cam="side">侧面跟拍</button>
          <button class="btn" data-cam="front">迎面特写</button>
          <button class="btn" data-cam="hero">低角大片</button>
        </div>
      </div>

      <div class="title-card keys-hint">
        <div><span class="key-pill">W</span>/<span class="key-pill">S</span> 加速与减速 · <span class="key-pill">A</span>/<span class="key-pill">D</span> 左右压弯转向</div>
        <div><span class="key-pill">Space</span> 跳跃扇翅 · <span class="key-pill">F</span> 投喂小鱼 · <span class="key-pill">B</span> 车铃与鸣叫</div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ============================================================================
     * 1. 原生 Web Audio 合成音效系统（车铃、鹈鹕叫声、跳跃、水花声）
     * ============================================================================ */
    class SoundEffects {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      ringBell() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [1568, 2349, 3136].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.055);
          gain.gain.setValueAtTime(0.09 / (idx + 1), now + idx * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.055 + 0.75);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.055);
          osc.stop(now + idx * 0.055 + 0.78);
        });
      }
      honk() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.linearRampToValueAtTime(310, now + 0.12);
        osc.frequency.exponentialRampToValueAtTime(165, now + 0.42);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(620, now);
        filter.Q.setValueAtTime(3.5, now);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.46);
      }
      jump() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.28);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.32);
      }
    }
    const sfx = new SoundEffects();

    /* ============================================================================
     * 2. 场景、相机、渲染器与灯光初始化
     * ============================================================================ */
    const container = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0xa6dcff, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 250);
    camera.position.set(5.2, 3.3, 6.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1.85, 0);
    controls.maxPolarAngle = Math.PI * 0.485;
    controls.minDistance = 2.6;
    controls.maxDistance = 18;

    // 灯光系统
    const hemiLight = new THREE.HemisphereLight(0xdff4ff, 0x3b6978, 0.85);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e0, 2.2);
    sunLight.position.set(14, 22, 12);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 2;
    sunLight.shadow.camera.far = 55;
    const d = 11;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // 海洋反射补光
    const oceanBounceLight = new THREE.DirectionalLight(0x38ada9, 0.55);
    oceanBounceLight.position.set(-10, 2, -12);
    scene.add(oceanBounceLight);

    // 太阳/月亮天体球
    const celestialGroup = new THREE.Group();
    scene.add(celestialGroup);
    const sunMesh = new THREE.Mesh(
      new THREE.SphereGeometry(3.2, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xffeaa7 })
    );
    sunMesh.position.set(-38, 24, -55);
    celestialGroup.add(sunMesh);

    /* ============================================================================
     * 3. 通用材质库与程序化 DataTexture（不使用 2D Canvas）
     * ============================================================================ */
    function createStripeDataTexture(c1, c2, size = 64, stripes = 8) {
      const data = new Uint8Array(size * size * 4);
      for (let y = 0; y < size; y++) {
        const isFirst = Math.floor((y / size) * stripes) % 2 === 0;
        const col = isFirst ? c1 : c2;
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;
          data[idx] = col[0];
          data[idx + 1] = col[1];
          data[idx + 2] = col[2];
          data[idx + 3] = 255;
        }
      }
      const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
      tex.needsUpdate = true;
      return tex;
    }

    const mats = {
      featherWhite: new THREE.MeshStandardMaterial({ color: 0xfafcff, roughness: 0.55, metalness: 0.05 }),
      featherCream: new THREE.MeshStandardMaterial({ color: 0xf3ead8, roughness: 0.6, metalness: 0.05 }),
      featherDark: new THREE.MeshStandardMaterial({ color: 0x2c3a47, roughness: 0.65 }),
      beakOrange: new THREE.MeshStandardMaterial({ color: 0xff9f1a, roughness: 0.35, metalness: 0.08 }),
      beakTipRed: new THREE.MeshStandardMaterial({ color: 0xeb2f06, roughness: 0.35 }),
      pouchPink: new THREE.MeshStandardMaterial({ color: 0xffbe76, roughness: 0.5, side: THREE.DoubleSide }),
      webFoot: new THREE.MeshStandardMaterial({ color: 0xf0932b, roughness: 0.45 }),
      eyeWhite: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }),
      eyeRing: new THREE.MeshStandardMaterial({ color: 0xffeaa7, roughness: 0.4 }),
      pupilBlack: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 }),
      hatBlue: new THREE.MeshStandardMaterial({ color: 0x1e3799, roughness: 0.5 }),
      scarfRed: new THREE.MeshStandardMaterial({ color: 0xe55039, roughness: 0.55, side: THREE.DoubleSide }),
      bikeFrame: new THREE.MeshStandardMaterial({ color: 0x00b894, roughness: 0.22, metalness: 0.45 }),
      bikeAccent: new THREE.MeshStandardMaterial({ color: 0xfd9644, roughness: 0.3, metalness: 0.3 }),
      chrome: new THREE.MeshStandardMaterial({ color: 0xdfe6e9, roughness: 0.15, metalness: 0.9 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xf6b93b, roughness: 0.2, metalness: 0.85 }),
      tireRubber: new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.85 }),
      tireWall: new THREE.MeshStandardMaterial({ color: 0xf8efba, roughness: 0.65 }),
      leather: new THREE.MeshStandardMaterial({ color: 0x6d4c41, roughness: 0.55 }),
      basketWood: new THREE.MeshStandardMaterial({ color: 0xc89f65, roughness: 0.75 }),
      fishSilver: new THREE.MeshStandardMaterial({ color: 0x82ccdd, roughness: 0.2, metalness: 0.75 })
    };

    // 交互拾取对象列表
    const interactables = [];

    /* ============================================================================
     * 4. 构建精致的程序化 3D 自行车 (Bicycle)
     * ============================================================================ */
    const rigRoot = new THREE.Group(); // 整体根节点（控制位置、转向倾斜、跳跃）
    scene.add(rigRoot);

    const bikeGroup = new THREE.Group();
    rigRoot.add(bikeGroup);

    const WHEEL_RADIUS = 0.66;
    const REAR_X = -0.92;
    const FRONT_X = 0.96;
    const BB_POS = new THREE.Vector3(-0.12, 0.64, 0); // 五通中轴位置
    const SEAT_TOP = new THREE.Vector3(-0.46, 1.54, 0);
    const HEAD_BOTTOM = new THREE.Vector3(0.68, 1.22, 0);
    const HEAD_TOP = new THREE.Vector3(0.56, 1.62, 0);

    // 辅助函数：根据两点创建圆管
    function createTubeBetween(p1, p2, radius, material) {
      const dir = new THREE.Vector3().subVectors(p2, p1);
      const len = dir.length();
      const geom = new THREE.CylinderGeometry(radius, radius, len, 14);
      const mesh = new THREE.Mesh(geom, material);
      mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // 创建辐条车轮（含外胎、白边、钢圈、花鼓、16根交叉钢丝）
    function createBicycleWheel() {
      const wheel = new THREE.Group();

      // 橡胶外胎
      const tire = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_RADIUS, 0.068, 16, 42), mats.tireRubber);
      tire.castShadow = true;
      wheel.add(tire);

      // 复古奶油白胎侧环
      const wall = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_RADIUS - 0.03, 0.052, 12, 42), mats.tireWall);
      wheel.add(wall);

      // 铝合金轮圈
      const rim = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_RADIUS - 0.065, 0.032, 12, 42), mats.chrome);
      wheel.add(rim);

      // 花鼓
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.16, 16), mats.chrome);
      hub.rotation.x = Math.PI / 2;
      wheel.add(hub);

      // 16 根交叉钢丝辐条 + 气门嘴
      const spokeCount = 16;
      const spokeLen = WHEEL_RADIUS - 0.09;
      const spokeGeom = new THREE.CylinderGeometry(0.006, 0.006, spokeLen, 6);
      for (let i = 0; i < spokeCount; i++) {
        const angle = (i / spokeCount) * Math.PI * 2;
        const spoke = new THREE.Mesh(spokeGeom, mats.chrome);
        const zOff = (i % 2 === 0 ? 1 : -1) * 0.025;
        spoke.position.set(
          Math.cos(angle) * (spokeLen * 0.5),
          Math.sin(angle) * (spokeLen * 0.5),
          zOff
        );
        spoke.rotation.z = angle - Math.PI / 2;
        spoke.rotation.x = (i % 2 === 0 ? 1 : -1) * 0.05;
        wheel.add(spoke);
      }

      // 黄色反光片
      const reflector = new THREE.Mesh(
        new THREE.BoxGeometry(0.09, 0.04, 0.015),
        new THREE.MeshStandardMaterial({ color: 0xffa801, emissive: 0xff793f, emissiveIntensity: 0.3 })
      );
      reflector.position.set(0, WHEEL_RADIUS * 0.58, 0);
      wheel.add(reflector);

      return wheel;
    }

    const rearWheel = createBicycleWheel();
    rearWheel.position.set(REAR_X, WHEEL_RADIUS, 0);
    rearWheel.userData.interactType = 'wheel';
    interactables.push(rearWheel);
    bikeGroup.add(rearWheel);

    // 车架主体管材
    const rearHubPos = new THREE.Vector3(REAR_X, WHEEL_RADIUS, 0);
    const seatTubeTop = new THREE.Vector3(-0.42, 1.42, 0);

    // 中管、下管、上管、头管
    bikeGroup.add(createTubeBetween(BB_POS, seatTubeTop, 0.036, mats.bikeFrame));
    bikeGroup.add(createTubeBetween(BB_POS, HEAD_BOTTOM, 0.038, mats.bikeFrame));
    bikeGroup.add(createTubeBetween(seatTubeTop, HEAD_TOP, 0.034, mats.bikeFrame));
    bikeGroup.add(createTubeBetween(HEAD_BOTTOM, HEAD_TOP, 0.042, mats.bikeFrame));

    // 左右后下叉 & 后上叉
    [-0.085, 0.085].forEach((zSide) => {
      const rHubSide = new THREE.Vector3(REAR_X, WHEEL_RADIUS, zSide);
      const bbSide = new THREE.Vector3(BB_POS.x, BB_POS.y, zSide * 0.7);
      const seatClusterSide = new THREE.Vector3(seatTubeTop.x, seatTubeTop.y - 0.06, zSide * 0.5);
      bikeGroup.add(createTubeBetween(bbSide, rHubSide, 0.022, mats.bikeFrame));
      bikeGroup.add(createTubeBetween(seatClusterSide, rHubSide, 0.02, mats.bikeFrame));
    });

    // 后轮挡泥板与后尾灯
    const rearFender = new THREE.Mesh(
      new THREE.TorusGeometry(WHEEL_RADIUS + 0.06, 0.045, 10, 28, Math.PI * 0.85),
      mats.bikeAccent
    );
    rearFender.position.copy(rearHubPos);

    /* ============================================================================

    const pelicanGroup = new THREE.Group();

    const lowerJawPivot = new THREE.Group();

    const pouchMesh = new THREE.Mesh(

    // 左右翅膀（搭在车把上，跳跃或加速时扇动）
    const wingPivotL = new THREE.Group();
    const wingPivotR = new THREE.Group();

    function buildWing(isLeft) {
      const zSign = isLeft ? 1 : -1;
      const pivot = isLeft ? wingPivotL : wingPivotR;
      pivot.position.set(0.15, 0.14, zSign * 0.34);

      // 主翼面
      const upperWing = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), mats.featherWhite);
      upperWing.scale.set(1.55, 0.32, 0.72);
      upperWing.position.set(0.26, -0.05, zSign * 0.08);

      pivot.add(upperWing);

      for (let i = 0; i < 4; i++) {
        const tip = new THREE.Mesh(new THREE.ConeGeometry(0.042, 0.32, 8), i < 2 ? mats.featherDark : mats.featherWhite);
        tip.position.set(0.56 - i * 0.04, -0.09 - i * 0.02, zSign * (0.11 - i * 0.02));

    buildWing(true);

    // 鹈鹕双腿与大脚蹼（使用解析法 2-Bone IK 实时贴合旋转脚踏）
    const THIGH_LEN = 0.46;
    const SHIN_LEN = 0.48;

    function createLegRig(isLeft) {
      const zSign = isLeft ? 1 : -1;
      const hipPos = new THREE.Vector3(-0.42, 1.62, zSign * 0.21);

      const thighMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.045, THIGH_LEN, 12), mats.featherWhite);
      thighMesh.castShadow = true;
      rigRoot.add(thighMesh);

      const kneeJoint = new THREE.Mesh(new THREE.SphereGeometry(0.048, 10, 10), mats.webFoot);
      rigRoot.add(kneeJoint);

      const shinMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.026, SHIN_LEN, 10), mats.webFoot);
      shinMesh.castShadow = true;
      rigRoot.add(shinMesh);

      // 橙色大脚蹼
      const footGroup = new THREE.Group();
      const webShape = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.022, 3), mats.webFoot);
      webShape.rotation.y = Math.PI / 2;
      webShape.position.set(0.06, 0.02, 0);
      footGroup.add(webShape);
      rigRoot.add(footGroup);

      return { hipPos, thighMesh, kneeJoint, shinMesh, footGroup, zSign };
    }

    const legL = createLegRig(true);
    const legR = createLegRig(false);

    // 解析法双骨骼 IK 更新函数（确保脚掌始终踩在踏板上，膝盖自然朝前弯曲）
    function solveLegIK(leg, pedalWorldInRig, bodyBounceY) {
      const hip = leg.hipPos.clone();
      hip.y += bodyBounceY;

      const ankle = pedalWorldInRig.clone();
      ankle.y += 0.025;

      const dx = ankle.x - hip.x;
      const dy = ankle.y - hip.y;
      const dist = Math.min(THIGH_LEN + SHIN_LEN - 0.01, Math.max(0.15, Math.hypot(dx, dy)));

      const baseAngle = Math.atan2(dy, dx);
      const cosKnee = THREE.MathUtils.clamp(
        (THIGH_LEN * THIGH_LEN + dist * dist - SHIN_LEN * SHIN_LEN) / (2 * THIGH_LEN * dist),
        -1,
        1
      );
      const bendAngle = Math.acos(cosKnee);
      const thighAngle = baseAngle + bendAngle; // 膝盖朝前上方折曲

      const knee = new THREE.Vector3(
        hip.x + Math.cos(thighAngle) * THIGH_LEN,
        hip.y + Math.sin(thighAngle) * THIGH_LEN,
        (hip.z + ankle.z) * 0.5 + leg.zSign * 0.03
      );

      // 更新大腿姿态
      const dirThigh = new THREE.Vector3().subVectors(knee, hip);
      leg.thighMesh.position.copy(hip).add(knee).multiplyScalar(0.5);
      leg.thighMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirThigh.normalize());

      leg.kneeJoint.position.copy(knee);

      // 更新小腿姿态
      const dirShin = new THREE.Vector3().subVectors(ankle, knee);
      leg.shinMesh.position.copy(knee).add(ankle).multiplyScalar(0.5);
      leg.shinMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirShin.normalize());

      // 更新脚蹼位置
      leg.footGroup.position.copy(ankle);
      leg.footGroup.rotation.z = Math.sin(state.pedalAngle + (leg.zSign > 0 ? 0 : Math.PI)) * 0.18;
    }

    /* ============================================================================
     * 6. 构建程序化海滨环境：公路、木栈道、动态波浪大海、椰子树、灯塔、海鸥
     * ============================================================================ */
    const envGroup = new THREE.Group();
    scene.add(envGroup);

    // 6.1 柏油海滨单车道与木栈道
    const ROAD_LEN = 120;
    const roadMesh = new THREE.Mesh(
      new THREE.BoxGeometry(ROAD_LEN, 0.3, 6.2),
      new THREE.MeshStandardMaterial({ color: 0x34495e, roughness: 0.88 })
    );

      if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 6) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj && !obj.userData.interactType && obj.parent) obj = obj.parent;
        const type = obj?.userData?.interactType;

    /* ============================================================================
     * 8. 主动画循环（全身协调骑行运动学、环境滚动、粒子与镜头追踪）
     * ============================================================================ */
    const clock = new THREE.Clock();
    let dustSpawnTimer = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // 1. 键盘速度与转向更新
      if (state.keys.w) {
        state.speedMul = Math.min(2.6, state.speedMul + dt * 0.85);
        updateSpeedUI();
      }
      if (state.keys.s) {
        state.speedMul = Math.max(0, state.speedMul - dt * 1.1);
        updateSpeedUI();
      }

      if (state.keys.a) state.steerTarget = -0.42;
      else if (state.keys.d) state.steerTarget = 0.42;
      else state.steerTarget = Math.sin(elapsed * 0.8) * 0.05; // 自然微幅巡航摆动

      state.steerCurrent += (state.steerTarget - state.steerCurrent) * Math.min(1, dt * 7);
      state.laneZ = THREE.MathUtils.clamp(state.laneZ + state.steerCurrent * state.speedMul * dt * 2.2, -1.85, 1.85);

      // 跳跃物理
      if (state.jumpY > 0 || state.jumpVel !== 0) {
        state.jumpY += state.jumpVel * dt;
        state.jumpVel -= 15.5 * dt;
        if (state.jumpY <= 0) {
          state.jumpY = 0;
          state.jumpVel = 0;
        }
      }

      rigRoot.position.set(0, state.jumpY, state.laneZ);
      // 压弯倾斜角与跳跃仰角
      rigRoot.rotation.x = -state.steerCurrent * 0.28 * Math.min(1.5, state.speedMul);
      rigRoot.rotation.y = -state.steerCurrent * 0.22;
      rigRoot.rotation.z = state.jumpVel * 0.028;

      // 前叉与车把转向
      steeringGroup.rotation.y = -state.steerCurrent * 0.65;

      // 2. 车轮、曲柄与链条滚动
      const angularVel = state.speedMul * 6.2;
      state.pedalAngle = (state.pedalAngle - angularVel * dt) % (Math.PI * 2);

      rearWheel.rotation.z -= angularVel * dt * 1.35;
      frontWheel.rotation.z -= angularVel * dt * 1.35;
      crankGroup.rotation.z = state.pedalAngle;
      chainring.rotation.y = -state.pedalAngle;

      // 脚踏板保持水平
      pedalPivotL.rotation.z = -state.pedalAngle;
      pedalPivotR.rotation.z = -state.pedalAngle;

      // 链条节点动画
      chainLinks.forEach((link, idx) => {
        const prog = ((idx / chainCount) - (state.pedalAngle / (Math.PI * 2)) * 0.5) % 1;
        const normP = (prog + 1) % 1;
        const isTop = normP < 0.5;
        const t = isTop ? normP * 2 : (normP - 0.5) * 2;
        const x = THREE.MathUtils.lerp(REAR_X, BB_POS.x, isTop ? t : 1 - t);
        const y = isTop
          ? THREE.MathUtils.lerp(WHEEL_RADIUS + 0.08, BB_POS.y + 0.19, t)
          : THREE.MathUtils.lerp(BB_POS.y - 0.19, WHEEL_RADIUS - 0.08, t);
        link.position.set(x, y, 0.075);
      });

      // 3. 鹈鹕全身运动学与双腿 IK 解算
      const cadenceBounce = Math.sin(state.pedalAngle * 2) * 0.045 * Math.min(1.5, state.speedMul);
      const bodySwayZ = Math.cos(state.pedalAngle) * 0.045 * Math.min(1.4, state.speedMul);

      bodyPivot.position.y = 1.82 + cadenceBounce;
      bodyPivot.rotation.x = bodySwayZ;
      bodyPivot.rotation.z = -0.18 + Math.cos(state.pedalAngle * 2) * 0.035;

      // 计算左右踏板在 rigRoot 坐标系下的实时位置并求解双腿 IK
      const pL = new THREE.Vector3(
        BB_POS.x + Math.cos(state.pedalAngle) * CRANK_RADIUS,
        BB_POS.y + Math.sin(state.pedalAngle) * CRANK_RADIUS,
        0.19
      );
      const pR = new THREE.Vector3(
        BB_POS.x + Math.cos(state.pedalAngle + Math.PI) * CRANK_RADIUS,
        BB_POS.y + Math.sin(state.pedalAngle + Math.PI) * CRANK_RADIUS,
        -0.19
      );
      solveLegIK(legL, pL, cadenceBounce);
      solveLegIK(legR, pR, cadenceBounce);

      // 脖子、头部、大喉囊弹性物理
      neckBase.rotation.z = Math.sin(state.pedalAngle * 2 - 0.5) * 0.06;
      headGroup.rotation.z = -neckBase.rotation.z * 0.8 + Math.sin(elapsed * 2.5) * 0.025;
      headGroup.rotation.y = -state.steerCurrent * 0.55;

      state.mouthOpen = Math.max(0, state.mouthOpen - dt * 1.4);
      lowerJawPivot.rotation.z = -0.06 - state.mouthOpen * 0.38 - Math.abs(cadenceBounce) * 1.2;

      // 喉囊果冻感膨胀与晃动
      const pouchScaleY = 0.58 + Math.min(0.35, state.fishCount * 0.06) + Math.sin(elapsed * 10 + state.pedalAngle * 2) * 0.045 + state.mouthOpen * 0.18;
      pouchMesh.scale.set(0.98, pouchScaleY, 0.25 + state.mouthOpen * 0.08);
      pouchFishGroup.visible = state.fishCount > 0;
      pouchFishGroup.rotation.x = Math.sin(elapsed * 14) * 0.22;

      // 眨眼动画
      const blinkCycle = elapsed % 4.2;
      const blinkAmt = blinkCycle > 4.02 ? Math.sin(((blinkCycle - 4.02) / 0.18) * Math.PI) : 0;
      eyelids.forEach((lid) => {
        lid.scale.y = 0.05 + blinkAmt * 0.95;
      });

      // 翅膀握把与扇动
      state.flapBoost = Math.max(0, state.flapBoost - dt * 1.6);
      const flapAngle = state.flapBoost > 0.01
        ? Math.sin(elapsed * 22) * 0.55 * state.flapBoost
        : Math.sin(state.pedalAngle) * 0.05;
      wingPivotL.rotation.x = flapAngle;
      wingPivotR.rotation.x = -flapAngle;
      wingPivotL.rotation.y = -state.steerCurrent * 0.25;
      wingPivotR.rotation.y = -state.steerCurrent * 0.25;

      // 围巾随风飘动
      const windSpeed = 4 + state.speedMul * 8;
      scarfTail1.rotation.z = 0.15 + Math.sin(elapsed * windSpeed) * 0.18;
      scarfTail2.rotation.z = 0.25 + Math.cos(elapsed * windSpeed * 1.1) * 0.22;

      // 车铃震动
      if (state.bellShake > 0) {
        state.bellShake = Math.max(0, state.bellShake - dt * 2.5);
        bellMesh.rotation.x = Math.sin(elapsed * 65) * 0.25 * state.bellShake;
      }

      // 4. 投喂鲜鱼抛物线轨迹更新
      for (let i = flyingFishes.length - 1; i >= 0; i--) {
        const item = flyingFishes[i];
        item.progress += dt * 1.65;
        const t = Math.min(1, item.progress);

        // 动态追踪鹈鹕喉囊世界坐标
        const targetWorld = new THREE.Vector3();
        pouchMesh.getWorldPosition(targetWorld);

        item.mesh.position.lerpVectors(item.startPos, targetWorld, t);
        item.mesh.position.y += Math.sin(t * Math.PI) * 1.85;
        item.mesh.rotation.z = t * Math.PI * 3;
        item.mesh.rotation.y = Math.sin(elapsed * 20) * 0.4;

        if (t >= 1) {
          scene.remove(item.mesh);
          flyingFishes.splice(i, 1);
          state.fishCount++;
          fishStat.textContent = `${state.fishCount} 条`;
          state.mouthOpen = 0.5;
          sfx.honk();
        }
      }

      // 5. 环境无限循环滚动与波浪动画
      const moveDelta = state.speedMul * 6.8 * dt;

      roadDashes.forEach((d) => {
        d.position.x -= moveDelta;
        if (d.position.x < -50) d.position.x += 100.8;
      });

      fencePosts.forEach((p) => {
        p.position.x -= moveDelta;
        if (p.position.x < -50) p.position.x += 96;
      });

      palmTrees.forEach((tree) => {
        tree.position.x -= moveDelta;
        if (tree.position.x < -48) tree.position.x += 98.4;
      });

      clouds.forEach((c, idx) => {
        c.position.x -= (0.4 + idx * 0.08 + state.speedMul * 0.5) * dt;
        if (c.position.x < -52) c.position.x = 52;
      });

      // 海鸥盘旋与扇翅
      seagulls.forEach((g) => {
        const u = g.userData;
        const a = elapsed * 0.55 + u.phase;
        g.position.set(
          Math.cos(a) * u.radius - 6,
          u.height + Math.sin(elapsed * 1.5 + u.phase) * 0.4,
          Math.sin(a) * u.radius - 16
        );
        g.rotation.y = -a;
        const gullFlap = Math.sin(elapsed * 7 + u.phase) * 0.45;
        u.wingL.rotation.z = gullFlap;
        u.wingR.rotation.z = -gullFlap;
      });

      // 灯塔光束旋转
      lanternBeacon.rotation.y = elapsed * 0.9;

      // 海面波浪顶点实时起伏
      const posAttr = oceanGeom.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const bx = oceanBasePos[i * 3];
        const by = oceanBasePos[i * 3 + 1];
        const bz = oceanBasePos[i * 3 + 2];
        const wave =
          Math.sin(bx * 0.22 + elapsed * 2.1) * 0.28 +
          Math.cos(bz * 0.35 + elapsed * 1.7) * 0.22;
        posAttr.setY(i, by + wave);
      }
      posAttr.needsUpdate = true;

      // 6. 车轮尾尘粒子特效
      dustSpawnTimer += dt * state.speedMul;
      if (dustSpawnTimer > 0.08 && state.jumpY < 0.05 && state.speedMul > 0.2) {
        dustSpawnTimer = 0;
        const p = dustParticles.find((item) => !item.visible);
        if (p) {
          p.visible = true;
          p.userData.life = 0;
          p.userData.maxLife = 0.55 + Math.random() * 0.35;
          p.position.set(REAR_X - 0.25, 0.12, rigRoot.position.z + (Math.random() - 0.5) * 0.2);
          p.userData.vel.set(-2.2 - state.speedMul * 2, 0.7 + Math.random() * 0.6, (Math.random() - 0.5) * 0.8);
        }
      }

      dustParticles.forEach((p) => {
        if (!p.visible) return;
        p.userData.life += dt;
        const ratio = p.userData.life / p.userData.maxLife;
        if (ratio >= 1) {
          p.visible = false;
          return;
        }
        p.position.addScaledVector(p.userData.vel, dt);
        const s = 0.5 + ratio * 1.6;
        p.scale.set(s, s, s);
        p.material.opacity = (1 - ratio) * 0.55;
      });

      // 7. 摄像机预设视角平滑跟随
      const targetLook = new THREE.Vector3(0, 1.85 + state.jumpY * 0.4, state.laneZ * 0.6);
      if (state.camMode === 'side') {
        camera.position.lerp(new THREE.Vector3(0.2, 2.2, 6.2 + state.laneZ), dt * 4);
        controls.target.lerp(targetLook, dt * 6);
      } else if (state.camMode === 'front') {
        camera.position.lerp(new THREE.Vector3(4.6, 2.35, 1.3 + state.laneZ), dt * 4);
        controls.target.lerp(new THREE.Vector3(0.2, 2.15, state.laneZ), dt * 6);
      } else if (state.camMode === 'hero') {
        camera.position.lerp(new THREE.Vector3(3.4, 0.95, 3.8 + state.laneZ), dt * 4);
        controls.target.lerp(new THREE.Vector3(0, 1.95, state.laneZ), dt * 6);
      } else {
        controls.target.lerp(targetLook, dt * 5);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateSpeedUI();
    animate();
  </script>
</body>
</html>
